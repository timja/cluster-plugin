{{- if .Values.postgres.inChart }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cnj.fullname" . }}-postgres
spec:
  serviceName: {{ include "cnj.fullname" . }}-postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            - {name: POSTGRES_DB, value: jenkins}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgres.user | quote }}]}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "cnj.fullname" . }}-postgres}
spec:
  selector: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
{{- end }}
{{- if .Values.blob.inChart }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnj.fullname" . }}-azurite
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-azurite}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-azurite}}
    spec:
      containers:
        - name: azurite
          image: {{ .Values.blob.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [azurite-blob, --blobHost, 0.0.0.0, --skipApiVersionCheck]
          ports: [{containerPort: 10000}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "cnj.fullname" . }}-azurite}
spec:
  selector: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-azurite}
  ports: [{port: 10000, targetPort: 10000}]
{{- end }}
