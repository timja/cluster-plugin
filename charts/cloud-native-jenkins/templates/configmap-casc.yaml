apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cnj.fullname" . }}-casc
data:
  base.yaml: |
{{ .Values.casc | indent 4 }}
{{- if .Values.artifactManager.enabled }}
  artifacts.yaml: |
    unclassified:
      artifactManager:
        artifactManagerFactories:
{{- if eq .Values.blob.type "s3" }}
          - jclouds:
              provider: s3
    aws:
      s3:
        container: {{ .Values.blob.s3.bucket | quote }}
        prefix: {{ printf "%s%s" .Values.blob.s3.prefix .Values.artifactManager.prefix | quote }}
{{- with .Values.blob.s3.endpoint }}
        customEndpoint: {{ regexReplaceAll "^https?://" . "" | quote }}
        useHttp: {{ hasPrefix "http://" . }}
{{- end }}
{{- with .Values.blob.s3.region }}
        customSigningRegion: {{ . | quote }}
{{- end }}
        usePathStyleUrl: {{ .Values.blob.s3.pathStyle }}
{{- else }}
          - azure:
              config:
                container: {{ .Values.blob.container | quote }}
                prefix: {{ .Values.artifactManager.prefix | quote }}
                storageCredentialId: cnj-blob
                disableExternalUrl: true
{{- end }}
{{- end }}
{{- if .Values.kubernetesCloud.enabled }}
  cloud.yaml: |
    jenkins:
      clouds:
        - kubernetes:
            name: kubernetes
            namespace: {{ .Values.kubernetesCloud.namespace | default .Release.Namespace | quote }}
            containerCap: {{ .Values.kubernetesCloud.containerCap }}
            webSocket: true
            garbageCollection:
              timeout: 120
            # no jenkinsUrl: each controller's pods connect back to it (KUBERNETES_JENKINS_URL)
            templates:
              - name: default
                label: k8s
                containers:
                  - name: jnlp
                    image: {{ .Values.kubernetesCloud.agentImage | quote }}
                    alwaysPullImage: false  # loaded into the cluster; IfNotPresent
{{- end }}
