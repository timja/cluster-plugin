{{- if not .Values.store.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnj.fullname" . }}-store
type: Opaque
stringData:
  CLUSTER_POSTGRES_URL: {{ include "cnj.storeUrl" . | quote }}
  CLUSTER_POSTGRES_USER: {{ .Values.postgres.user | quote }}
  CLUSTER_POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- if eq .Values.blob.type "s3" }}
  CLUSTER_S3_BUCKET: {{ required "blob.s3.bucket is required with blob.type s3" .Values.blob.s3.bucket | quote }}
  CLUSTER_S3_PREFIX: {{ .Values.blob.s3.prefix | quote }}
  CLUSTER_S3_REGION: {{ .Values.blob.s3.region | quote }}
  CLUSTER_S3_ENDPOINT: {{ .Values.blob.s3.endpoint | quote }}
  CLUSTER_S3_PATH_STYLE: {{ .Values.blob.s3.pathStyle | quote }}
{{- else }}
  CLUSTER_AZURE_BLOB_CONNECTION_STRING: {{ include "cnj.blobConnection" . | quote }}
  CLUSTER_AZURE_BLOB_CONTAINER: {{ .Values.blob.container | quote }}
{{- end }}
{{- if and (ne .Values.blob.type "s3") .Values.blob.inChart }}
  # the artifact manager's storage credential (Azurite's well-known development account, not a secret)
  CNJ_BLOB_ACCOUNT_NAME: devstoreaccount1
  CNJ_BLOB_ACCOUNT_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  CNJ_BLOB_ENDPOINT: "http://{{ include "cnj.fullname" . }}-azurite:10000/devstoreaccount1"
{{- else if and (ne .Values.blob.type "s3") .Values.artifactManager.accountName }}
  CNJ_BLOB_ACCOUNT_NAME: {{ .Values.artifactManager.accountName | quote }}
  CNJ_BLOB_ENDPOINT: {{ .Values.artifactManager.blobEndpoint | quote }}
{{- end }}
{{- end }}
