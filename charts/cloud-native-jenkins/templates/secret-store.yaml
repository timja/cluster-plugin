apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnj.fullname" . }}-store
type: Opaque
stringData:
  CNJ_STORE_URL: {{ include "cnj.storeUrl" . | quote }}
  CNJ_STORE_USER: {{ .Values.postgres.user | quote }}
  CNJ_STORE_PASSWORD: {{ .Values.postgres.password | quote }}
  CNJ_BLOB_CONNECTION_STRING: {{ include "cnj.blobConnection" . | quote }}
  CNJ_BLOB_CONTAINER: {{ .Values.blob.container | quote }}
