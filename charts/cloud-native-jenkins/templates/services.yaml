# Browsers, API clients and agents: any controller, no affinity (sessions are stateless, Target 6).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnj.fullname" . }}
spec:
  selector: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-controller}
  type: {{ .Values.service.type }}
  sessionAffinity: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
# Controllers reaching each other (request forwarding, Targets 6-7), and stable per-controller names.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnj.fullname" . }}-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: {{ include "cnj.fullname" . }}-controller}
  ports: [{name: http, port: 8080, targetPort: 8080}]
