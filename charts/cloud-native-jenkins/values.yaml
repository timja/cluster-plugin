# Controllers: a StatefulSet for stable names (logs, the cluster view); their homes are disposable (emptyDir).
controllers: 2
image: cnj/jenkins:k8s
imagePullPolicy: Never   # loaded into the cluster (kind load docker-image)
resources:
  requests: {cpu: 250m, memory: 1Gi}
  limits: {memory: 2Gi}
javaOpts: ""
updateSites:
  # Each controller downloads update-site and tool-installer metadata at startup and then daily, as on one controller,
  # so the Plugins page can install (cluster-wide, Target 13) as soon as a controller is up. false for air-gapped clusters.
  fetch: true

# The Service browsers, API clients and agents use (no session affinity).
service:
  type: ClusterIP
  nodePort: null         # with type NodePort, e.g. 30080

# The S0 key material (pre-plugin keys), identical for every controller: a Secret with a seed.tgz key,
# made once with scripts/make-seed-secret.sh.
seedSecret: cnj-seed

# Configuration as code, identical for every controller. Settings not declared here are edited in the UI and shared.
casc: |
  jenkins:
    systemMessage: "cloud-native-jenkins on Kubernetes"
    numExecutors: 0
    securityRealm:
      local:
        allowsSignup: false
        users:
          - id: admin
            password: admin
    authorizationStrategy: loggedInUsersCanDoAnything
    crumbIssuer: cluster
  unclassified:
    globalDefaultFlowDurabilityLevel:
      durabilityHint: MAX_SURVIVABILITY

# Kubernetes agents: a cloud in the agent namespace; each controller's pods connect back to it (KUBERNETES_JENKINS_URL).
kubernetesCloud:
  enabled: true
  containerCap: 4
  namespace: ""          # default: the release namespace
  agentImage: jenkins/inbound-agent:latest-jdk21

# Shared state. In-chart Postgres and Azurite are for development; point at managed services in production.
# The stores' connection settings (Target 15: managed services). existingSecret names a Secret with
# CNJ_STORE_URL, CNJ_STORE_USER, CNJ_STORE_PASSWORD, CNJ_BLOB_CONNECTION_STRING and CNJ_BLOB_CONTAINER, used instead
# of postgres.url/user/password and blob.connectionString/container (which then need not be in values at all).
store:
  existingSecret: ""
  poolSize: 8            # database connections per controller for ordinary work (plus 2 for heartbeats and leases)
  # Session-lock liveness (a dead controller's builds are adopted ~6 s after its death): needs a direct connection to
  # Postgres; turn off behind a pooler in transaction mode (PgBouncer), which does not keep sessions.
  sessionLocks: true
  # Share the files plugins write with their own file APIs in item and user directories (e.g. the avatar plugin's
  # image), every minute (Target 15). Off by default: it scans every item and user directory.
  sharePluginFiles: false
postgres:
  inChart: true
  image: postgres:16
  url: ""                # e.g. jdbc:postgresql://db.example.com:5432/jenkins when not in-chart
  # appended to the URL, e.g. sslmode=verify-full&sslrootcert=/etc/cnj-db/root.crt (mount it with extraVolumes)
  urlParameters: ""
  user: jenkins
  password: jenkins
# Persistent volumes for the in-chart Postgres and Azurite (kind: the local-path provisioner)
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
blob:
  inChart: true
  image: mcr.microsoft.com/azure-storage/azurite:3.34.0
  connectionString: ""   # when not in-chart
  container: jenkins
