apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster.fullname" . }}-agents
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, events, secrets]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster.fullname" . }}-agents
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "cluster.fullname" . }}-agents}
subjects: [{kind: ServiceAccount, name: {{ include "cluster.fullname" . }}, namespace: {{ .Release.Namespace }}}]
