# Validation harness for cloud-native Jenkins experiments.
#
#   docker compose up -d --build postgres azurite jenkins-a          # single controller
#   docker compose --profile multi up -d --build                     # + jenkins-b and the LB
#
# Knobs (env):
#   HOME_A / HOME_B   named volume used as JENKINS_HOME (default home-a / home-b;
#                     set both to home-shared for shared-home experiments)
#   JENKINS_WAR_DIR   host dir containing jenkins.war to override the image war (Target 1 builds)
#   CNJ_INOTIFY       1 to record JENKINS_HOME filesystem events to ./out/<name>.inotify.log
#   CNJ_JAVA_OPTS     extra JVM options for both controllers (./out/sync is mounted read-only at /sync)

x-jenkins: &jenkins
  build: ./jenkins
  image: cnj/jenkins:dev
  depends_on: [postgres, azurite]
  environment: &jenkins-env
    CASC_JENKINS_CONFIG: /casc
    JAVA_OPTS: >-
      -Djenkins.install.runSetupWizard=false
      -Dhudson.model.UpdateCenter.never=true
      -Dhudson.model.DownloadService.never=true
      -Djava.awt.headless=true
      ${CNJ_JAVA_OPTS:-}
    CNJ_INOTIFY: ${CNJ_INOTIFY:-0}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jenkins
      POSTGRES_PASSWORD: jenkins
      POSTGRES_DB: jenkins

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck

  jenkins-a:
    <<: *jenkins
    hostname: jenkins-a
    environment:
      <<: *jenkins-env
      JENKINS_CLUSTER_NAME: jenkins-a
      CNJ_URL: http://localhost:8081/
    volumes:
      - ./jenkins/casc:/casc:ro
      - ./out:/inventory
      - ./out/sync:/sync:ro
      - ${JENKINS_WAR_DIR:-./jenkins/no-war-override}:/war-override:ro
      - ${HOME_A:-home-a}:/var/jenkins_home
    ports: ["8081:8080", "50001:50000"]

  jenkins-b:
    <<: *jenkins
    profiles: [multi]
    hostname: jenkins-b
    environment:
      <<: *jenkins-env
      JENKINS_CLUSTER_NAME: jenkins-b
      CNJ_URL: http://localhost:8082/
    volumes:
      - ./jenkins/casc:/casc:ro
      - ./out:/inventory
      - ./out/sync:/sync:ro
      - ${JENKINS_WAR_DIR:-./jenkins/no-war-override}:/war-override:ro
      - ${HOME_B:-home-b}:/var/jenkins_home
    ports: ["8082:8080", "50002:50000"]

  lb:
    image: nginx:1.27
    profiles: [multi]
    depends_on: [jenkins-a, jenkins-b]
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]

  agent:
    image: jenkins/inbound-agent:latest-jdk21
    profiles: [agent]
    environment:
      JENKINS_URL: ${AGENT_JENKINS_URL:-http://jenkins-a:8080/}
      JENKINS_SECRET: ${AGENT_SECRET:-unset}
      JENKINS_AGENT_NAME: agent1
      JENKINS_WEB_SOCKET: "true"

volumes:
  home-a:
  home-b:
  home-shared:
