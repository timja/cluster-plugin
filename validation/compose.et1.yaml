# Target 1-3 acceptance (ET1, ET2, ET3): two controllers with EPHEMERAL homes (tmpfs) sharing item configuration,
# build numbers and build records through the Postgres persistence store, and build snapshots and Pipeline logs
# through Azure Blob Storage (Azurite). Standalone (not an overlay of compose.yaml).
#
#   docker compose -f compose.et1.yaml up -d
#
# Populated by experiments/ET1-shared-items.sh under .et1/:
#   war/jenkins.war   core from the cnj/t1 integration branch
#   plugins/*.hpi     persistence-store-postgresql, cloudbees-folder from cnj/t1 branches
#   seed/             S0 key material (findings/E8)
#   repo/             git repository shared by both controllers (multibranch scenario)
name: et1

x-jenkins: &jenkins
  image: cnj/jenkins:dev
  depends_on: [postgres, azurite]
  tmpfs:
    - /var/jenkins_home:uid=1000,gid=1000,mode=0755,size=2g
  environment: &env
    CASC_JENKINS_CONFIG: /casc
    JAVA_OPTS: >-
      -Djenkins.install.runSetupWizard=false
      -Dhudson.model.UpdateCenter.never=true
      -Dhudson.model.DownloadService.never=true
      -Djava.awt.headless=true
      -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      -Dhudson.security.TokenBasedRememberMeServices2.alwaysRemember=true
      ${CNJ_JAVA_OPTS:-}
    CNJ_STORE_URL: jdbc:postgresql://postgres:5432/jenkins
    CNJ_STORE_USER: jenkins
    CNJ_STORE_PASSWORD: jenkins
    # Target 3: build snapshots and Pipeline logs (Azurite's well-known development account)
    CNJ_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    CNJ_BLOB_CONTAINER: jenkins
    CNJ_SEED_DIR: /et1/seed
    CNJ_INOTIFY: ${CNJ_INOTIFY:-0}
    # the shared repo is bind-mounted with a host owner
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  volumes: &vols
    - ${CNJ_CASC_DIR:-./jenkins/casc-et1}:/casc:ro
    - ./out:/inventory
    - ./.et1:/et1
    - ./.et1/war:/war-override:ro
    - ./.et1/plugins:/extra-plugins:ro
    - ./.et1/repo:/repo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jenkins
      POSTGRES_PASSWORD: jenkins
      POSTGRES_DB: jenkins

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

  jenkins-a:
    <<: *jenkins
    hostname: jenkins-a
    environment:
      <<: *env
      CNJ_NAME: jenkins-a
      CNJ_INTERNAL_URL: http://jenkins-a:8080/
    ports: ["8081:8080"]

  jenkins-b:
    <<: *jenkins
    hostname: jenkins-b
    environment:
      <<: *env
      CNJ_NAME: jenkins-b
      CNJ_INTERNAL_URL: http://jenkins-b:8080/
    ports: ["8082:8080"]

  # Target 4 (profile "agents"): an inbound WebSocket agent behind a failover URL
  lb:
    image: nginx:1.27
    profiles: [agents]
    volumes:
      - ./lb/failover.conf:/etc/nginx/conf.d/default.conf:ro

  agent1:
    image: jenkins/inbound-agent:latest-jdk21
    profiles: [agents]
    depends_on: [lb]
    environment:
      JENKINS_URL: http://lb/
      JENKINS_AGENT_NAME: agent1
      JENKINS_WEB_SOCKET: "true"
    # the secret is derived from the seeded key material, written by the experiment
    entrypoint: ["sh", "-c", "JENKINS_SECRET=$$(cat /et1/agent1.secret) exec /usr/local/bin/jenkins-agent"]
    volumes:
      - ./.et1:/et1:ro

  # Target 6: a load balancer which does not pin browsers (round robin), for browsers and API clients
  rr:
    image: nginx:1.27
    volumes:
      - ./lb/roundrobin.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8090:80"]
