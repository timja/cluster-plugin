# Target 4: agents reach the controllers through a URL that fails over instead of balancing:
# everything goes to jenkins-a while it answers, otherwise to jenkins-b.
upstream jenkins_failover {
    server jenkins-a:8080 max_fails=1 fail_timeout=10s;
    server jenkins-b:8080 backup;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    location / {
        proxy_pass http://jenkins_failover;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-Upstream $upstream_addr always;
    }
}
