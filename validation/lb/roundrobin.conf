# Target 6: round robin across controllers, no stickiness; a controller that does not answer is skipped.
upstream jenkins_rr {
    server jenkins-a:8080 max_fails=1 fail_timeout=5s;
    server jenkins-b:8080 max_fails=1 fail_timeout=5s;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    location / {
        proxy_pass http://jenkins_rr;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-Upstream $upstream_addr always;
    }
}
