# ET17 (scale): an overlay on compose.et1.yaml with pg_stat_statements for the top queries. The third controller,
# jenkins-c, is in compose.et1.yaml (profile "et17"): an overlay cannot drop the port jenkins-a's settings would bring.
services:
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
